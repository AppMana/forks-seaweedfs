name: Check out the go-fuse fork
description: >
  go.mod replaces github.com/seaweedfs/go-fuse/v2 with ../forks-go-fuse, so any
  job that builds weed needs that sibling checkout next to the repository.
  Checks out AppMana/forks-go-fuse at the pinned
  SEAWEEDFS_RELIABILITY_GO_FUSE_REF. Run it right after actions/checkout.
  actions/checkout does the fetch, so job containers without git or bash work
  too; it only checks out under the workspace, so the tree is moved out after.

inputs:
  ref:
    description: Full go-fuse commit SHA
    required: true

runs:
  using: composite
  steps:
    - if: runner.os != 'Windows'
      shell: sh
      env:
        GO_FUSE_REF: ${{ inputs.ref }}
      run: |
        set -eu
        case "$GO_FUSE_REF" in
          *[!0-9a-f]*|'') echo "::error::go-fuse ref must be a full commit SHA"; exit 1 ;;
        esac
        [ "${#GO_FUSE_REF}" -eq 40 ] || { echo "::error::go-fuse ref must be a full commit SHA"; exit 1; }
    - if: runner.os == 'Windows'
      shell: bash
      env:
        GO_FUSE_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        [[ "$GO_FUSE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::go-fuse ref must be a full commit SHA"; exit 1; }

    - uses: actions/checkout@v7
      with:
        repository: AppMana/forks-go-fuse
        ref: ${{ inputs.ref }}
        path: .appmana-go-fuse
        persist-credentials: false

    - if: runner.os != 'Windows'
      shell: sh
      env:
        GO_FUSE_REF: ${{ inputs.ref }}
      run: |
        set -eu
        dest="$GITHUB_WORKSPACE/../forks-go-fuse"
        rm -rf "$dest"
        mv "$GITHUB_WORKSPACE/.appmana-go-fuse" "$dest"
        echo "go-fuse $GO_FUSE_REF at $dest"
    - if: runner.os == 'Windows'
      shell: bash
      env:
        GO_FUSE_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        dest="$GITHUB_WORKSPACE/../forks-go-fuse"
        rm -rf "$dest"
        mv "$GITHUB_WORKSPACE/.appmana-go-fuse" "$dest"
        echo "go-fuse $GO_FUSE_REF at $dest"
