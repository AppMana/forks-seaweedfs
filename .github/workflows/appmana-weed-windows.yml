name: AppMana weed.exe (WinFsp) build and test

on:
  push:
    branches: ['merge/**']
  pull_request:
    branches: ['merge/**']
  workflow_dispatch:
    inputs:
      comparison_ref:
        description: 'Optional full commit SHA for paired native mount benchmarks'
        type: string
        required: false
      comparison_pairs:
        description: 'Number of alternating baseline/candidate benchmark pairs'
        type: number
        default: 6
      fuzz_time:
        description: 'How long to fuzz the WinFsp adapter model (Go duration)'
        type: string
        default: 5m

permissions:
  contents: read

env:
  GO_FUSE_REPO: https://github.com/AppMana/forks-go-fuse
  GO_FUSE_BRANCH: appmana/windows-compile
  # Pinned WinFsp release; keep in sync with the MSI vendored into the
  # seaweedfs-mount Windows image in forks-seaweedfs-csi-driver.
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi

jobs:
  lint-new-code:
    # Static analysis of what this push or pull request adds, for both
    # builds of the mount; upstream code keeps its own findings.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          path: forks-seaweedfs
          fetch-depth: 0
      - name: Clone forks-go-fuse sibling (go.mod replace target)
        run: git clone --depth 1 -b "$GO_FUSE_BRANCH" "$GO_FUSE_REPO" forks-go-fuse
      - uses: actions/setup-go@v5
        with:
          go-version-file: forks-seaweedfs/go.mod
          cache-dependency-path: forks-seaweedfs/go.sum
      - name: Lint new code
        working-directory: forks-seaweedfs
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: '0'
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base HEAD origin/merge/upstream-4.51)
          fi
          GOOS= GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          "$RUNNER_TEMP/bin/golangci-lint" run -c hack/appmana/golangci.yml --new-from-rev="$BASE" --timeout 20m \
            ./weed/mount/... ./weed/command/... ./weed/operation/... ./weed/shell/...

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: forks-seaweedfs
      - name: Clone forks-go-fuse sibling (go.mod replace target)
        run: git clone --depth 1 -b "$GO_FUSE_BRANCH" "$GO_FUSE_REPO" forks-go-fuse
      - uses: actions/setup-go@v5
        with:
          go-version-file: forks-seaweedfs/go.mod
          cache-dependency-path: forks-seaweedfs/go.sum
      - name: Vet (linux)
        working-directory: forks-seaweedfs
        run: go vet -copylocks=false -tags 5BytesOffset ./weed/mount/... ./weed/command/
      - name: Windows smoke harness rejects failed prerequisites
        shell: pwsh
        run: ./forks-seaweedfs/hack/appmana/mount-smoke-contract-test.ps1
      - name: Verify PowerShell contract exit status under the Actions wrapper
        working-directory: forks-seaweedfs
        run: python3 -m unittest discover -s hack/appmana -p 'test_smoke_contract_exit.py' -v
      - name: Verify real-VM campaign schedules both permission policies
        working-directory: forks-seaweedfs
        run: python3 -m unittest discover -s hack/appmana -p 'test_windows_suite_policy.py' -v
      - name: Cross-compile gate (windows/amd64, large disk)
        working-directory: forks-seaweedfs
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags 5BytesOffset ./weed/...
          GOOS=windows GOARCH=amd64 go vet -copylocks=false -tags 5BytesOffset ./weed/command/ ./weed/mount/
      - name: Linux unit tests (regression gate for shared-file edits)
        working-directory: forks-seaweedfs
        # weed/filer and weed/pb carry fork-specific behavior that is not
        # Windows-only but exists for the Windows/CSI path: the
        # -readerCacheMode override threaded down to ReaderPattern
        # (weed/filer), and the local-gRPC-socket TCP fallback that makes
        # `weed mini` work where AF_UNIX bind fails (weed/pb). Both live in
        # files upstream edits often, so they belong in the merge gate.
        run: go test -count=1 -tags 5BytesOffset ./weed/mount/... ./weed/command/... ./weed/filer/... ./weed/pb/... ./weed/s3api/...

  test-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        cgo: ["0", "1"]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      # cgo builds compile against the WinFsp FUSE headers (installed by
      # the MSI); the DLL is still loaded at runtime in both variants.
      CPATH: C:\Program Files (x86)\WinFsp\inc\fuse
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: forks-seaweedfs
      - name: Clone forks-go-fuse sibling (go.mod replace target)
        run: git clone --depth 1 -b "$env:GO_FUSE_BRANCH" "$env:GO_FUSE_REPO" forks-go-fuse
      - uses: actions/setup-go@v5
        with:
          go-version-file: forks-seaweedfs/go.mod
          cache-dependency-path: forks-seaweedfs/go.sum
      - name: Install WinFsp (pinned MSI)
        run: |
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile winfsp.msi
          Start-Process -NoNewWindow -Wait msiexec -ArgumentList '/i','winfsp.msi','/qn','INSTALLLEVEL=1000'
          if (-not (Get-Service WinFsp.Launcher -ErrorAction SilentlyContinue)) {
            throw "WinFsp service not present after install"
          }
      - name: Build weed.exe
        working-directory: forks-seaweedfs
        run: |
          $commit = (git rev-parse --short HEAD)
          go build -tags 5BytesOffset -ldflags "-s -w -X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=$commit" -o weed.exe ./weed
          .\weed.exe version
      - name: Native windows unit tests (winfsp adapter, mount, command)
        working-directory: forks-seaweedfs
        # weed/mount/winfsp is upstream's adapter. The mount does not run it,
        # but it builds against the fork's WFS, so its tests keep that WFS
        # honest for upstream merges.
        run: go test -count=1 -tags 5BytesOffset ./weed/mount/ ./weed/mount/winfsp/ ./weed/command/
      - name: Fuzz the adapter against the filer model
        if: matrix.cgo == '0'
        working-directory: forks-seaweedfs
        # Coverage-guided sequences of local operations, other mounts' events
        # and cache expiry; the committed corpus already ran as unit tests.
        run: go test -run '^$' -fuzz '^FuzzWinfspAdapterModel$' -fuzztime "${{ inputs.fuzz_time || '5m' }}" -tags 5BytesOffset ./weed/mount/
      - name: Upload failing fuzz inputs
        if: failure() && matrix.cgo == '0'
        uses: actions/upload-artifact@v4
        with:
          name: winfsp-adapter-fuzz-failures
          path: forks-seaweedfs/weed/mount/testdata/fuzz/
          if-no-files-found: ignore
      - name: Upload weed.exe
        uses: actions/upload-artifact@v4
        with:
          name: weed-windows-amd64-large-disk-cgo${{ matrix.cgo }}
          path: forks-seaweedfs/weed.exe
          if-no-files-found: error

  mount-smoke:
    runs-on: windows-2022
    needs: [test-windows]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install WinFsp (pinned MSI)
        run: |
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile winfsp.msi
          Start-Process -NoNewWindow -Wait msiexec -ArgumentList '/i','winfsp.msi','/qn','INSTALLLEVEL=1000'
      - uses: actions/download-artifact@v4
        with:
          name: weed-windows-amd64-large-disk-cgo0
      - name: Verify traced namespace and Git atomic rename regression
        run: ./hack/appmana/mount-smoke.ps1 -WeedExe (Resolve-Path ./weed.exe) -TestCase GitAtomicRenamePrimed -GitIterations 20
      - name: Verify Git LFS temp-file metadata regression
        run: ./hack/appmana/mount-smoke.ps1 -WeedExe (Resolve-Path ./weed.exe) -TestCase GitLfsTempMetadata -GitIterations 10
      - name: Upload mount test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: git-atomic-rename-logs
          path: |
            ${{ runner.temp }}/sw-smoke/logs/**
          if-no-files-found: ignore

  mount-cuzz:
    runs-on: windows-2022
    needs: [test-windows]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install WinFsp (pinned MSI)
        run: |
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile winfsp.msi
          Start-Process -NoNewWindow -Wait msiexec -ArgumentList '/i','winfsp.msi','/qn','INSTALLLEVEL=1000'
      - uses: actions/download-artifact@v4
        with:
          name: weed-windows-amd64-large-disk-cgo0
      - name: Reproduce with AppVerifier Cuzz seed 1
        run: ./hack/appmana/winfsp-cuzz.ps1 -WeedExe (Resolve-Path ./weed.exe) -RandomSeed 1 -TraceSummary
      - name: Upload Cuzz mount logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-atomic-rename-cuzz-seed-1
          path: |
            ${{ runner.temp }}/sw-cuzz-1/logs/**
          if-no-files-found: ignore
      - name: Upload failed Cuzz workroot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: git-atomic-rename-cuzz-seed-1-workroot
          path: |
            ${{ runner.temp }}/sw-cuzz-1/**
          if-no-files-found: ignore

  winfsp-compat:
    runs-on: windows-2022
    needs: [test-windows]
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install WinFsp with tests (pinned)
        run: |
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile winfsp.msi
          Start-Process -NoNewWindow -Wait msiexec -ArgumentList '/i','winfsp.msi','/qn','INSTALLLEVEL=1000'
          $testsUrl = $env:WINFSP_MSI_URL -replace 'winfsp-([0-9.]+)\.msi','winfsp-tests-$1.zip'
          Invoke-WebRequest -Uri $testsUrl -OutFile winfsp-tests.zip
          Expand-Archive winfsp-tests.zip -DestinationPath winfsp-tests
      - uses: actions/download-artifact@v4
        with:
          name: weed-windows-amd64-large-disk-cgo0
      - name: Run winfsp-tests (advisory)
        run: ./hack/appmana/winfsp-compat.ps1 -WeedExe (Resolve-Path ./weed.exe) -TestsExe (Resolve-Path ./winfsp-tests/winfsp-tests-x64.exe)

  mount-bench:
    runs-on: windows-2022
    needs: [test-windows]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install WinFsp (pinned MSI)
        run: |
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile winfsp.msi
          Start-Process -NoNewWindow -Wait msiexec -ArgumentList '/i','winfsp.msi','/qn','INSTALLLEVEL=1000'
      - uses: actions/download-artifact@v4
        with:
          name: weed-windows-amd64-large-disk-cgo0
          path: cgo0
      - uses: actions/download-artifact@v4
        with:
          name: weed-windows-amd64-large-disk-cgo1
          path: cgo1
      - name: Bench nocgo, new options (production defaults)
        run: ./hack/appmana/mount-bench.ps1 -WeedExe (Resolve-Path ./cgo0/weed.exe) -Label nocgo-cached
      - name: Bench nocgo, legacy options (pre-caching baseline)
        run: ./hack/appmana/mount-bench.ps1 -WeedExe (Resolve-Path ./cgo0/weed.exe) -Label nocgo-legacy -WinfspOptions 'FileInfoTimeout=1000,DirInfoTimeout=1000'
      - name: Bench cgo, new options
        run: ./hack/appmana/mount-bench.ps1 -WeedExe (Resolve-Path ./cgo1/weed.exe) -Label cgo-cached
      - name: Bench cgo, legacy options
        run: ./hack/appmana/mount-bench.ps1 -WeedExe (Resolve-Path ./cgo1/weed.exe) -Label cgo-legacy -WinfspOptions 'FileInfoTimeout=1000,DirInfoTimeout=1000'
      - name: Check out comparison baseline
        if: inputs.comparison_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.comparison_ref }}
          path: comparison/forks-seaweedfs
      - name: Set up Go for comparison
        if: inputs.comparison_ref != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: comparison/forks-seaweedfs/go.mod
      - name: Build comparison baseline
        if: inputs.comparison_ref != ''
        run: |
          git clone --depth 1 -b $env:GO_FUSE_BRANCH $env:GO_FUSE_REPO comparison/forks-go-fuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED = '0'
          Push-Location comparison/forks-seaweedfs
          go build -tags 5BytesOffset -o ../../baseline.exe ./weed
          $buildExit = $LASTEXITCODE
          Pop-Location
          if ($buildExit -ne 0) { exit $buildExit }
      - name: Paired native mount benchmarks
        if: inputs.comparison_ref != ''
        env:
          COMPARISON_PAIRS: ${{ inputs.comparison_pairs }}
        run: |
          $pairs = [int]$env:COMPARISON_PAIRS
          if ($pairs -lt 2 -or $pairs -gt 20) { throw 'comparison_pairs must be between 2 and 20' }
          $binaries = @{ baseline = (Resolve-Path ./baseline.exe); candidate = (Resolve-Path ./cgo0/weed.exe) }
          for ($pair = 1; $pair -le $pairs; $pair++) {
            $order = if ($pair % 2) { @('baseline', 'candidate') } else { @('candidate', 'baseline') }
            foreach ($label in $order) {
              ./hack/appmana/mount-bench.ps1 -WeedExe $binaries[$label] -Label "$label-pair-$pair"
            }
          }
