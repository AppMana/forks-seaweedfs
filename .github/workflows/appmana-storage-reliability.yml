name: AppMana storage reliability gates

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional full baseline commit SHA; otherwise use repository variable'
        type: string
        required: false
      windows_trace:
        description: 'Capture ETW FileIO and WinFsp debug evidence in disposable Windows VMs'
        type: boolean
        default: false
      windows_mount_manager_probe:
        description: 'Run the isolated native mount-manager stress test before Windows qualification'
        type: boolean
        default: false
      windows_mount_cleanup:
        description: 'Run same-path graceful and process-crash mount cleanup in both registration modes'
        type: boolean
        default: false
      windows_msvc_build:
        description: 'Build matched WinFsp DLLs offline with MSVC and qualify the candidate in disposable Windows VMs'
        type: boolean
        default: false
  push:
    branches: [master, main, 'merge/**']
    paths: ['weed/**', 'test/volume_server/**', 'test/storage_lab/**', 'test/winfsp/**', 'hack/appmana/**', 'go.mod', 'go.sum', '.github/workflows/appmana-storage-reliability.yml']
  pull_request:
    paths: ['weed/**', 'test/volume_server/**', 'test/storage_lab/**', 'test/winfsp/**', 'hack/appmana/**', 'go.mod', 'go.sum', '.github/workflows/appmana-storage-reliability.yml']

permissions:
  contents: read

# Update repository variables after release qualification; never silently use
# HEAD~1 or a moving branch as a compatibility baseline. See README.md.
env:
  BASELINE_REF: ${{ inputs.baseline_ref || vars.SEAWEEDFS_RELIABILITY_BASELINE_REF }}
  GO_FUSE_REF: ${{ vars.SEAWEEDFS_RELIABILITY_GO_FUSE_REF }}
  LABCONTAINERS_REF: ${{ vars.SEAWEEDFS_RELIABILITY_LABCONTAINERS_REF }}
  LABCONTAINERS_VM_IMAGE: ${{ vars.SEAWEEDFS_RELIABILITY_LABCONTAINERS_VM_IMAGE }}
  LABCONTAINERS_WINDOWS_IMAGE: ${{ vars.SEAWEEDFS_RELIABILITY_LABCONTAINERS_WINDOWS_IMAGE }}
  STORAGE_BUILD_TAGS: 5BytesOffset
  STORAGE_UNIT_TEST_TIMEOUT: 10m
  STORAGE_PROCESS_TEST_TIMEOUT: 5m

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc-qualification:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.windows_msvc_build) || (github.event_name == 'push' && vars.SEAWEEDFS_RELIABILITY_WINFSP_MSVC_ENABLED == '1') }}
    runs-on: [self-hosted, linux, x64, kvm, seaweedfs-lab]
    timeout-minutes: 240
    defaults:
      run:
        working-directory: seaweedfs
    env:
      SEAWEEDFS_WINDOWS_MSVC_BUILD_LIVE: '1'
      SEAWEEDFS_WINDOWS_MSVC_ISO: ${{ vars.SEAWEEDFS_RELIABILITY_MSVC_ISO_PATH }}
      SEAWEEDFS_WINDOWS_MSVC_ISO_SHA256: ${{ vars.SEAWEEDFS_RELIABILITY_MSVC_ISO_SHA256 }}
      SEAWEEDFS_WINFSP_MSI: ${{ vars.SEAWEEDFS_RELIABILITY_WINFSP_MSI_PATH }}
      WINFSP_MSI_SHA256: ${{ vars.SEAWEEDFS_RELIABILITY_WINFSP_MSI_SHA256 }}
      SEAWEEDFS_GIT_INSTALLER: ${{ vars.SEAWEEDFS_RELIABILITY_GIT_INSTALLER_PATH }}
      GIT_INSTALLER_SHA256: ${{ vars.SEAWEEDFS_RELIABILITY_GIT_INSTALLER_SHA256 }}
      SEAWEEDFS_WINDOWS_GIT_LFS_DIAGNOSTIC: ${{ vars.SEAWEEDFS_RELIABILITY_GIT_LFS_PATH }}
      GIT_LFS_SHA256: ${{ vars.SEAWEEDFS_RELIABILITY_GIT_LFS_SHA256 }}
      LABCONTAINERS_LABD: ${{ github.workspace }}/labcontainers/bin/labd
    steps:
      - uses: actions/checkout@v7
        with:
          path: seaweedfs
      - name: Validate pinned native build inputs
        run: |
          set -euo pipefail
          [[ "$LABCONTAINERS_REF" =~ ^[0-9a-f]{40}$ && "$GO_FUSE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LABCONTAINERS_WINDOWS_IMAGE" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]
          test -c /dev/kvm
          test "$(containerlab version --short 2>/dev/null | tr -d 'v')" = '0.79.0'
          docker image inspect "$LABCONTAINERS_WINDOWS_IMAGE" >/dev/null
          # Require an explicit LFS client for this release-build qualification.
          for pair in 'SEAWEEDFS_WINDOWS_MSVC_ISO SEAWEEDFS_WINDOWS_MSVC_ISO_SHA256' 'SEAWEEDFS_WINFSP_MSI WINFSP_MSI_SHA256' 'SEAWEEDFS_GIT_INSTALLER GIT_INSTALLER_SHA256' 'SEAWEEDFS_WINDOWS_GIT_LFS_DIAGNOSTIC GIT_LFS_SHA256'; do
            read -r path_name hash_name <<< "$pair"
            [[ "${!path_name}" = /* && "${!hash_name}" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "${!hash_name}" "${!path_name}" | sha256sum -c -
          done
      - uses: actions/checkout@v7
        with:
          repository: AppMana/labcontainers
          ref: ${{ env.LABCONTAINERS_REF }}
          path: labcontainers
      - uses: actions/checkout@v7
        with:
          repository: AppMana/forks-go-fuse
          ref: ${{ env.GO_FUSE_REF }}
          path: forks-go-fuse
      - uses: actions/setup-go@v6
        with:
          go-version-file: seaweedfs/go.mod
          cache-dependency-path: |
            seaweedfs/go.sum
            labcontainers/go.sum
      - name: Build and verify matched native DLL artifacts
        run: |
          set -euo pipefail
          (cd "$GITHUB_WORKSPACE/labcontainers" && make build)
          compiler_work=$(mktemp -d "$RUNNER_TEMP/winfsp-msvc-work.XXXXXXXX")
          (cd "$compiler_work" && go work init "$GITHUB_WORKSPACE/seaweedfs/test/storage_lab/vm" "$GITHUB_WORKSPACE/labcontainers")
          export GOWORK="$compiler_work/go.work"
          printf 'GOWORK=%s\n' "$GOWORK" >> "$GITHUB_ENV"
          compiler_results=$(mktemp -d "$RUNNER_TEMP/winfsp-msvc-ci.XXXXXXXX")
          RUNNER_TEMP="$compiler_results" go test ./test/storage_lab/vm -run '^TestWindowsWinFspMSVCBuildLab$' -count=1 -v -timeout=65m 2>&1 | tee "$compiler_results/test.log"
          results=("$compiler_results"/winfsp-msvc-results-*)
          [[ "${#results[@]}" == 1 && -d "${results[0]}" ]]
          test -s "${results[0]}/candidate-winfsp-x64.dll"
          printf 'SEAWEEDFS_WINDOWS_WINFSP_DLL=%s\n' "${results[0]}/candidate-winfsp-x64.dll" >> "$GITHUB_ENV"
          printf 'Native WinFsp source/patch/toolchain manifests and binaries: `%s`\n' "${results[0]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Qualify the exact compiled candidate
        env:
          SEAWEEDFS_WINDOWS_MOUNT_LIVE: '1'
          SEAWEEDFS_WINDOWS_MOUNT_REPEATS: '5'
          SEAWEEDFS_WINDOWS_WINFSP_TEST: ${{ runner.temp }}/msvc-winfsp.test.exe
          SEAWEEDFS_WINDOWS_WEED: ${{ runner.temp }}/msvc-weed.exe
        run: |
          set -euo pipefail
          candidate_sha=$(git rev-parse HEAD)
          GOWORK=off GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$SEAWEEDFS_WINDOWS_WINFSP_TEST" ./test/winfsp
          GOWORK=off GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags "$STORAGE_BUILD_TAGS" -ldflags "-X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=$candidate_sha" -o "$SEAWEEDFS_WINDOWS_WEED" ./weed
          for registration in '' 1; do
            export SEAWEEDFS_WINDOWS_MOUNT_MANAGER_FROM_FSD="$registration"
            SEAWEEDFS_WINDOWS_MOUNT_MANAGER_CHECK_CLEANUP=1 SEAWEEDFS_WINDOWS_MOUNT_SCENARIO=MountManagerDirectoryLifecycle go test ./test/storage_lab/vm -run '^TestWindowsMountLab$' -count=1 -v -timeout=45m
            for scenario in MountManagerProcessCrash MountManagerRegistrationRollback; do
              SEAWEEDFS_WINDOWS_MOUNT_SCENARIO="$scenario" go test ./test/storage_lab/vm -run '^TestWindowsMountLab$' -count=1 -v -timeout=45m
            done
          done
          unset SEAWEEDFS_WINDOWS_MOUNT_MANAGER_FROM_FSD
          go test ./test/storage_lab/vm -run '^TestWindowsMountLab$' -count=1 -v -timeout=45m
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: winfsp-msvc-build-and-qualification
          path: |
            ${{ runner.temp }}/winfsp-msvc-ci.*/
            ${{ runner.temp }}/seaweedfs-windows-mount-results-*/
          if-no-files-found: error
          retention-days: 30

  large-disk-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: seaweedfs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: seaweedfs
      - name: Windows trace tooling contracts
        run: |
          python3 -m unittest discover -s hack/appmana -p 'test_analyze_fileio.py'
          pwsh -NoProfile -File hack/appmana/mount-smoke-contract-test.ps1
          pwsh -NoProfile -File hack/appmana/install-lab-git-lfs-test.ps1
          pwsh -NoProfile -File hack/appmana/build-winfsp-msvc-test.ps1
      - name: Validate explicit compatibility inputs
        run: |
          for name in BASELINE_REF GO_FUSE_REF; do
            if [[ ! "${!name}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::$name must be a full commit SHA. Configure the repository variables documented in README.md."
              exit 1
            fi
          done
          baseline_sha=$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")
          candidate_sha=$(git rev-parse HEAD)
          if [ "$baseline_sha" = "$candidate_sha" ]; then
            echo "::error::Baseline and candidate are identical; this would not test an upgrade."
            exit 1
          fi
          printf 'BASELINE_SHA=%s\nCANDIDATE_SHA=%s\n' "$baseline_sha" "$candidate_sha" >> "$GITHUB_ENV"
          printf 'Baseline: `%s`\n\nCandidate: `%s`\n\nGo-FUSE: `%s`\n' "$baseline_sha" "$candidate_sha" "$GO_FUSE_REF" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          repository: AppMana/forks-go-fuse
          ref: ${{ env.GO_FUSE_REF }}
          path: forks-go-fuse
      - uses: actions/setup-go@v6
        with:
          go-version-file: seaweedfs/go.mod
          cache-dependency-path: seaweedfs/go.sum
      - name: Race-tested production offset format
        run: >-
          go test -short -tags "$STORAGE_BUILD_TAGS" -race -count=1 -timeout="$STORAGE_UNIT_TEST_TIMEOUT"
          ./weed/storage ./weed/topology ./weed/shell ./weed/server
          ./weed/filer ./weed/filer/empty_folder_cleanup ./weed/mount ./weed/operation
      - name: Windows fault harness safety contracts
        run: go test -race -count=1 ./test/winfsp -run '^TestCrashChildOwnership$|^TestMappedImportSlot$|^TestLabMappedPE$|^TestLabMountQuiescence$'
      - name: Lab isolation command contracts
        run: python3 -m unittest discover -s test/storage_lab -v
      - name: Negative controls prove regressions turn red
        env:
          MUTANT_LOG_DIR: ${{ runner.temp }}/storage-mutant-logs
        run: test/storage_lab/verify_mutants.sh
      - name: Streamed S3 copy durability regressions
        run: >-
          go test -tags "$STORAGE_BUILD_TAGS" -race -count=1 -timeout="$STORAGE_UNIT_TEST_TIMEOUT"
          ./weed/s3api -run 'TestStreamCopyChunkRange|TestNewChunkUploadOption'
      - name: Build explicit baseline and candidate
        run: |
          # Both worktrees resolve ../forks-go-fuse to the pinned checkout.
          git worktree add --detach "$GITHUB_WORKSPACE/seaweed-baseline" "$BASELINE_SHA"
          (cd "$GITHUB_WORKSPACE/seaweed-baseline" && go build -tags "$STORAGE_BUILD_TAGS" -ldflags "-X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=$BASELINE_SHA" -o "$RUNNER_TEMP/weed-baseline" ./weed)
          go build -tags "$STORAGE_BUILD_TAGS" -ldflags "-X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=$CANDIDATE_SHA" -o "$RUNNER_TEMP/weed-candidate" ./weed
          "$RUNNER_TEMP/weed-baseline" version
          "$RUNNER_TEMP/weed-candidate" version
      - name: Build isolated lab tests
        run: |
          go test -c -tags "$STORAGE_BUILD_TAGS" -race -o "$RUNNER_TEMP/storage.test" ./weed/storage
          preallocate_overlay=$(python3 test/storage_lab/preallocate_mutant.py)
          go test -c -tags "$STORAGE_BUILD_TAGS" -race -overlay "$preallocate_overlay" -o "$RUNNER_TEMP/storage-preallocate-mutant.test" ./weed/storage
          go test -c -tags "$STORAGE_BUILD_TAGS" -o "$RUNNER_TEMP/volume-grpc.test" ./test/volume_server/grpc
          go test -c -tags "$STORAGE_BUILD_TAGS" -o "$RUNNER_TEMP/volume-http.test" ./test/volume_server/http
      - name: Isolated storage, migration, and admission lab
        run: |
          missing=0
          for command in bwrap mkfs.xfs mkfs.btrfs xfs_repair btrfs losetup unshare; do
            command -v "$command" >/dev/null || missing=1
          done
          if [ "$missing" = 1 ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap xfsprogs btrfs-progs util-linux
          fi
          MUTANT_LOG_DIR="$RUNNER_TEMP/storage-mutant-logs" test/storage_lab/verify_preallocate_mutant.sh "$RUNNER_TEMP/storage-preallocate-mutant.test"
          python3 test/storage_lab/run.py storage --tests "$RUNNER_TEMP/storage.test"
          python3 test/storage_lab/run_filesystem.py xfs --tests "$RUNNER_TEMP/storage.test"
          python3 test/storage_lab/run_filesystem.py btrfs --tests "$RUNNER_TEMP/storage.test"
          python3 test/storage_lab/run_filesystem.py xfs --enospc --tests "$RUNNER_TEMP/storage.test"
          python3 test/storage_lab/run_filesystem.py btrfs --enospc --tests "$RUNNER_TEMP/storage.test"
          python3 test/storage_lab/run.py migration --tests "$RUNNER_TEMP/volume-grpc.test" \
            --candidate "$RUNNER_TEMP/weed-candidate" --baseline "$RUNNER_TEMP/weed-baseline"
          python3 test/storage_lab/run.py admission --tests "$RUNNER_TEMP/volume-http.test" \
            --candidate "$RUNNER_TEMP/weed-candidate"
      - name: Admission and baseline-to-candidate rollback
        env:
          WEED_BINARY: ${{ runner.temp }}/weed-candidate
          WEED_VOLUME_BINARY: ${{ runner.temp }}/weed-baseline
          WEED_CANDIDATE_BINARY: ${{ runner.temp }}/weed-candidate
          VOLUME_SERVER_IT_KEEP_LOGS: '1'
        run: |
          # Admission must exercise the candidate, not the initial baseline.
          WEED_VOLUME_BINARY="$WEED_CANDIDATE_BINARY" go test -tags "$STORAGE_BUILD_TAGS" -count=1 -timeout="$STORAGE_PROCESS_TEST_TIMEOUT" ./test/volume_server/http -run '^TestUploadLimitTimeoutIncludesReplication$'
          go test -tags "$STORAGE_BUILD_TAGS" -count=1 -timeout="$STORAGE_PROCESS_TEST_TIMEOUT" ./test/volume_server/grpc -run '^TestVolumeBinaryUpgradeVacuumRollback$'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-reliability-process-logs
          path: |
            /tmp/seaweedfs_volume_server_it_*/logs/
            /tmp/seaweedfs-lab-results-*/
            /tmp/seaweedfs-fs-results-*/
            ${{ runner.temp }}/storage-mutant-logs/
          if-no-files-found: warn
          retention-days: 14

  vm-fault-gates:
    # PR code must not execute on a Docker/KVM-capable self-hosted runner.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    # This runner must be disposable/dedicated and provide KVM, Docker,
    # Containerlab 0.79.0, and the pinned Labcontainers VM image. It must not
    # have routes or credentials for production networks.
    runs-on: [self-hosted, linux, x64, kvm, seaweedfs-lab]
    timeout-minutes: 240
    defaults:
      run:
        working-directory: seaweedfs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: seaweedfs
      - name: Validate immutable VM-lab inputs
        run: |
          for name in BASELINE_REF GO_FUSE_REF LABCONTAINERS_REF; do
            if [[ ! "${!name}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::$name must be a full commit SHA. Configure the repository variables documented in README.md."
              exit 1
            fi
          done
          if [[ ! "$LABCONTAINERS_VM_IMAGE" =~ ^[^[:space:]]+@sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "::error::LABCONTAINERS_VM_IMAGE must be an immutable image reference with an @sha256 digest."
            exit 1
          fi
          command -v docker
          command -v containerlab
          test "$(containerlab version --short 2>/dev/null | tr -d 'v')" = "0.79.0" || {
            echo "::error::The dedicated runner must provide Containerlab 0.79.0."
            exit 1
          }
          test -c /dev/kvm || { echo "::error::The dedicated runner has no /dev/kvm."; exit 1; }
          docker image inspect "$LABCONTAINERS_VM_IMAGE" >/dev/null || {
            echo "::error::The pinned Labcontainers VM image is not preloaded."
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          repository: AppMana/labcontainers
          ref: ${{ env.LABCONTAINERS_REF }}
          path: labcontainers
      - uses: actions/checkout@v7
        with:
          repository: AppMana/forks-go-fuse
          ref: ${{ env.GO_FUSE_REF }}
          path: forks-go-fuse
      - uses: actions/setup-go@v6
        with:
          go-version-file: seaweedfs/go.mod
          cache-dependency-path: |
            seaweedfs/go.sum
            labcontainers/go.sum
      - name: Resolve and build exact baseline and candidate
        run: |
          baseline_sha=$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")
          candidate_sha=$(git rev-parse HEAD)
          if [ "$baseline_sha" = "$candidate_sha" ]; then
            echo "::error::Baseline and candidate are identical; this would not test an upgrade."
            exit 1
          fi
          git worktree add --detach "$GITHUB_WORKSPACE/seaweed-baseline-vm" "$baseline_sha"
          (cd "$GITHUB_WORKSPACE/seaweed-baseline-vm" && go build -tags "$STORAGE_BUILD_TAGS" -ldflags "-X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=$baseline_sha" -o "$RUNNER_TEMP/weed-baseline-vm" ./weed)
          go build -tags "$STORAGE_BUILD_TAGS" -ldflags "-X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=$candidate_sha" -o "$RUNNER_TEMP/weed-candidate-vm" ./weed
          printf 'VM baseline: `%s`\n\nVM candidate: `%s`\n\nLabcontainers: `%s`\n\nVM image: `%s`\n' "$baseline_sha" "$candidate_sha" "$LABCONTAINERS_REF" "$LABCONTAINERS_VM_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Unit-test the Labcontainers VM harness
        run: |
          vm_work=$(mktemp -d "$RUNNER_TEMP/seaweedfs-vm-work.XXXXXXXX")
          (cd "$vm_work" && go work init "$GITHUB_WORKSPACE/seaweedfs/test/storage_lab/vm" "$GITHUB_WORKSPACE/labcontainers")
          GOWORK="$vm_work/go.work" go test ./test/storage_lab/vm/...
      - name: Run isolated four-VM durability gates
        env:
          LABCONTAINERS_SOURCE: ${{ github.workspace }}/labcontainers
          LABCONTAINERS_REF: ${{ env.LABCONTAINERS_REF }}
        run: |
          runner=test/storage_lab/vm/run_vm.sh
          candidate="$RUNNER_TEMP/weed-candidate-vm"
          baseline="$RUNNER_TEMP/weed-baseline-vm"
          "$runner" --candidate "$candidate" --image "$LABCONTAINERS_VM_IMAGE" --filesystem ext4 --scenario replicated-vacuum
          "$runner" --candidate "$candidate" --image "$LABCONTAINERS_VM_IMAGE" --filesystem ext4 --scenario power-loss
          "$runner" --candidate "$candidate" --baseline "$baseline" --image "$LABCONTAINERS_VM_IMAGE" --filesystem ext4 --scenario migration
          "$runner" --candidate "$candidate" --image "$LABCONTAINERS_VM_IMAGE" --filesystem ext4 --scenario vacuum-power-loss
          for filesystem in xfs btrfs; do
            "$runner" --candidate "$candidate" --image "$LABCONTAINERS_VM_IMAGE" --filesystem "$filesystem" --scenario vacuum-power-loss
          done
      - name: Native Windows core storage regressions
        env:
          SEAWEEDFS_WINDOWS_LIVE: '1'
          SEAWEEDFS_WINDOWS_STORAGE_TEST: ${{ runner.temp }}/windows-storage.test.exe
          LABCONTAINERS_LABD: ${{ github.workspace }}/labcontainers/bin/labd
        run: |
          [[ "$LABCONTAINERS_WINDOWS_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          docker image inspect "$LABCONTAINERS_WINDOWS_IMAGE" >/dev/null
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -tags "$STORAGE_BUILD_TAGS" -o "$SEAWEEDFS_WINDOWS_STORAGE_TEST" ./weed/storage
          (cd "$GITHUB_WORKSPACE/labcontainers" && make build)
          windows_work=$(mktemp -d "$RUNNER_TEMP/windows-work.XXXXXXXX")
          (cd "$windows_work" && go work init "$GITHUB_WORKSPACE/seaweedfs/test/storage_lab/vm" "$GITHUB_WORKSPACE/labcontainers")
          export GOWORK="$windows_work/go.work"
          go test ./test/storage_lab/vm -list '^TestWindowsStorageLab$' | grep -Fx TestWindowsStorageLab
          go test ./test/storage_lab/vm -run '^TestWindowsStorageLab$' -count=1 -v -timeout=18m
      - name: Isolated Windows WinFsp Git and LFS regressions
        env:
          SEAWEEDFS_WINDOWS_MOUNT_LIVE: '1'
          SEAWEEDFS_WINDOWS_MOUNT_REPEATS: '5'
          SEAWEEDFS_WINDOWS_MOUNT_VERBOSITY: '1'
          SEAWEEDFS_WINDOWS_MOUNT_TRACE: ${{ inputs.windows_trace && '1' || '0' }}
          WINDOWS_MOUNT_MANAGER_PROBE: ${{ inputs.windows_mount_manager_probe && '1' || '0' }}
          WINDOWS_MOUNT_CLEANUP: ${{ inputs.windows_mount_cleanup && '1' || '0' }}
          SEAWEEDFS_WINDOWS_WINFSP_TEST: ${{ runner.temp }}/windows-winfsp.test.exe
          SEAWEEDFS_WINDOWS_WEED: ${{ runner.temp }}/windows-weed.exe
          SEAWEEDFS_WINFSP_MSI: ${{ vars.SEAWEEDFS_RELIABILITY_WINFSP_MSI_PATH }}
          WINFSP_MSI_SHA256: ${{ vars.SEAWEEDFS_RELIABILITY_WINFSP_MSI_SHA256 }}
          SEAWEEDFS_GIT_INSTALLER: ${{ vars.SEAWEEDFS_RELIABILITY_GIT_INSTALLER_PATH }}
          GIT_INSTALLER_SHA256: ${{ vars.SEAWEEDFS_RELIABILITY_GIT_INSTALLER_SHA256 }}
          SEAWEEDFS_WINDOWS_GIT_LFS_DIAGNOSTIC: ${{ vars.SEAWEEDFS_RELIABILITY_GIT_LFS_PATH }}
          GIT_LFS_SHA256: ${{ vars.SEAWEEDFS_RELIABILITY_GIT_LFS_SHA256 }}
          LABCONTAINERS_LABD: ${{ github.workspace }}/labcontainers/bin/labd
        run: |
          set -euo pipefail
          for hash in "$WINFSP_MSI_SHA256" "$GIT_INSTALLER_SHA256"; do
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          done
          [[ "$SEAWEEDFS_WINFSP_MSI" = /* && "$SEAWEEDFS_GIT_INSTALLER" = /* ]]
          printf '%s  %s\n' "$WINFSP_MSI_SHA256" "$SEAWEEDFS_WINFSP_MSI" | sha256sum -c -
          printf '%s  %s\n' "$GIT_INSTALLER_SHA256" "$SEAWEEDFS_GIT_INSTALLER" | sha256sum -c -
          if [[ -n "$SEAWEEDFS_WINDOWS_GIT_LFS_DIAGNOSTIC" || -n "$GIT_LFS_SHA256" ]]; then
            [[ "$SEAWEEDFS_WINDOWS_GIT_LFS_DIAGNOSTIC" = /* && "$GIT_LFS_SHA256" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "$GIT_LFS_SHA256" "$SEAWEEDFS_WINDOWS_GIT_LFS_DIAGNOSTIC" | sha256sum -c -
            printf 'Explicit Windows Git LFS SHA-256: `%s`\n' "$GIT_LFS_SHA256" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Windows Git LFS: using the pinned Git installer bundle; see setup.log for its version.' >> "$GITHUB_STEP_SUMMARY"
          fi
          candidate_sha=$(git rev-parse HEAD)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags "$STORAGE_BUILD_TAGS" -ldflags "-X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=$candidate_sha" -o "$SEAWEEDFS_WINDOWS_WEED" ./weed
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$SEAWEEDFS_WINDOWS_WINFSP_TEST" ./test/winfsp
          windows_work=$(mktemp -d "$RUNNER_TEMP/windows-mount-work.XXXXXXXX")
          (cd "$windows_work" && go work init "$GITHUB_WORKSPACE/seaweedfs/test/storage_lab/vm" "$GITHUB_WORKSPACE/labcontainers")
          export GOWORK="$windows_work/go.work"
          go test ./test/storage_lab/vm -list '^TestWindowsMountLab$' | grep -Fx TestWindowsMountLab
          go test ./test/storage_lab/vm -run '^TestWindowsArtifact' -count=1
          if [[ "$WINDOWS_MOUNT_MANAGER_PROBE" == '1' ]]; then
            SEAWEEDFS_WINDOWS_MOUNT_SCENARIO=MountManagerDirectoryLifecycle go test ./test/storage_lab/vm -run '^TestWindowsMountLab$' -count=1 -v -timeout=45m 2>&1 | tee "$RUNNER_TEMP/windows-mount-manager-test.log"
          fi
          if [[ "$WINDOWS_MOUNT_CLEANUP" == '1' ]]; then
            for registration in '' 1; do
              mode="${registration:-default}"
              SEAWEEDFS_WINDOWS_MOUNT_MANAGER_FROM_FSD="$registration" SEAWEEDFS_WINDOWS_MOUNT_MANAGER_CHECK_CLEANUP=1 SEAWEEDFS_WINDOWS_MOUNT_SCENARIO=MountManagerDirectoryLifecycle go test ./test/storage_lab/vm -run '^TestWindowsMountLab$' -count=1 -v -timeout=45m 2>&1 | tee "$RUNNER_TEMP/windows-mount-cleanup-$mode.log"
              SEAWEEDFS_WINDOWS_MOUNT_MANAGER_FROM_FSD="$registration" SEAWEEDFS_WINDOWS_MOUNT_SCENARIO=MountManagerProcessCrash go test ./test/storage_lab/vm -run '^TestWindowsMountLab$' -count=1 -v -timeout=45m 2>&1 | tee "$RUNNER_TEMP/windows-mount-crash-$mode.log"
            done
          fi
          go test ./test/storage_lab/vm -run '^TestWindowsMountLab$' -count=1 -v -timeout=45m 2>&1 | tee "$RUNNER_TEMP/windows-mount-test.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-reliability-vm-lab-results
          path: |
            /tmp/seaweedfs-vm-lab-results-*/
            /tmp/seaweedfs-windows-mount-results-*/
            ${{ runner.temp }}/seaweedfs-windows-mount-results-*/
            ${{ runner.temp }}/windows-mount-test.log
            ${{ runner.temp }}/windows-mount-manager-test.log
            ${{ runner.temp }}/windows-mount-cleanup-*.log
            ${{ runner.temp }}/windows-mount-crash-*.log
          if-no-files-found: error
          retention-days: 14
