name: Telemetry Integration Tests

on:
  push:
    branches: [ master, 'merge/**' ]
    paths:
      - 'telemetry/**'
      - 'weed/telemetry/**'
      - '.github/workflows/telemetry-integration.yml'
  pull_request:
    branches: [ master, 'merge/**' ]
    paths:
      - 'telemetry/**'
      - 'weed/telemetry/**'
      - '.github/workflows/telemetry-integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: read

jobs:
  telemetry-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check out the go-fuse fork
      uses: ./.github/actions/appmana-go-fuse
      with:
        ref: ${{ vars.SEAWEEDFS_RELIABILITY_GO_FUSE_REF }}

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: ${{ runner.environment == 'github-hosted' }}

    - name: Build telemetry server
      run: cd telemetry/server && go build -o telemetry-server .

    - name: Run telemetry integration test
      run: go run telemetry/test/integration.go

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: telemetry-test-logs
        path: telemetry-server-test.log
        retention-days: 7
